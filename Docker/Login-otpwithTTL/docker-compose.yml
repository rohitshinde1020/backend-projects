services:
  redis:
    image: redis:latest
    container_name: login-otp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:latest
    container_name: login-otp-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: setup_database
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data: